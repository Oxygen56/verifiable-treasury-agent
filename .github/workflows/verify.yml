name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit:release
      - name: Generate deterministic unsigned V2 plan
        run: |
          pnpm --silent plan:v2 > unsigned-settlement-plan-v2.json
          node -e 'JSON.parse(require("node:fs").readFileSync("unsigned-settlement-plan-v2.json", "utf8"))'
      - uses: actions/upload-artifact@v4
        with:
          name: v2-unsigned-plan-evidence
          path: unsigned-settlement-plan-v2.json
          if-no-files-found: error
